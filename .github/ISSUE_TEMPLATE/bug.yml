name: Bug
description: Something is broken. An apply fails, a function errors, or verify.sh fails.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        For data that looks wrong while everything runs, use the data-quality
        template instead. This one is for things that fail.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Include error messages, log excerpts, the failing action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can someone reproduce it?
      description: Commands, queries, or the failing function's log entry.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Recent changes, what you've already tried.
    validations:
      required: false
