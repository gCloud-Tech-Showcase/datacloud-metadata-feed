name: Bug
description: Something is broken — a Dataform run failing, an apply blowing up, a query erroring.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        For data that looks wrong while the pipeline runs fine, use the
        data-quality template instead — this one is for things that actually fail.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Include error messages, log excerpts, the failing action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can someone reproduce it?
      description: Commands, queries, or a link to the workflow invocation.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Recent changes, what you've already tried.
    validations:
      required: false
